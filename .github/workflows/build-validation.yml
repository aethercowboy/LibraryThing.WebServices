name: Build Validation

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LibraryThing.WebServices.sln

      - name: Build
        run: dotnet build LibraryThing.WebServices.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LibraryThing.WebServices.sln --configuration Release --no-build
